        p.name.toLowerCase().includes(query.toLowerCase())
      );
      if (roleFilter !== "All") {
        filtered = filtered.filter(p => p.role === roleFilter);
      }
      return filtered.sort((a,b) => a.name.localeCompare(b.name));

      <section className="space-y-8">

          </p>
        </header>

              type="text"
              placeholder="Search by name..."
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              className="w-full pl-12 pr-4 py-3 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-200"

          </div>
          <select 
            value={roleFilter}
            onChange={(e) => setRoleFilter(e.target.value)}
            className="px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-medium"

                <div className="space-y-1">
                  <div className="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">

                  </div>
                  <h4 className="font-bold text-slate-800 group-hover:text-[#004BA0] transition-colors line-clamp-1">
                    {player.name}
                  </h4>
                  <p className="text-xs text-slate-500 truncate">{player.highlights}</p>
                </div>
                <div className="flex items-center justify-between">
                  <Badge variant={player.role === 'Batter' ? 'primary' : (player.role === 'Bowler' ? 'success' : 'gold')}>
                    {player.role}
                  </Badge>
                  {player.isOverseas && <i className="fas fa-globe text-slate-400 text-xs" title="Overseas"></i>}
                </div>
              </div>
            </Card>
          ))}
        </div>

        {filteredPlayers.length === 0 && (
          <div className="text-center py-20 bg-slate-50 rounded-3xl border-2 border-dashed border-slate-200">
            <i className="fas fa-user-slash text-4xl text-slate-300 mb-2"></i>
            <p className="text-slate-500">No players match "{query}"</p>
          </div>
        )}
      </section>
    );

              <th className="p-4 text-xs font-bold text-slate-500 uppercase">Season</th>
              <th className="p-4 text-xs font-bold text-slate-500 uppercase">Final Rank</th>
              <th className="p-4 text-xs font-bold text-slate-500 uppercase">Captain</th>
              <th className="p-4 text-xs font-bold text-slate-500 uppercase">MVP</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-50">
            {SEASONS.map((s) => (
              <tr key={s.year} className="hover:bg-blue-50/50">
                <td className="p-4 font-bold text-slate-700">{s.year}</td>
                <td className="p-4">
                  <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold ${
                    s.result === 'Champions' ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-600'
                  }`}>
                    {s.result === 'Champions' && <i className="fas fa-trophy text-xs"></i>}
                    {s.result}
                  </span>
                </td>
                <td className="p-4 text-sm text-slate-600">{s.captain}</td>
                <td className="p-4 text-sm font-medium text-slate-800">{s.mvp}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </section>
  );

  const ProfilesView = () => (
    <div className="text-center py-20 bg-white rounded-3xl border border-slate-100 shadow-sm">
      <i className="fas fa-id-card text-5xl text-slate-200 mb-4"></i>
      <h3 className="text-2xl font-bold text-slate-800">Detailed Player Profiles</h3>
      <p className="text-slate-500 max-w-md mx-auto mt-2">Interactive stats, career journeys, and memorable moments — launching soon.</p>
      <div className="mt-6">
        <span className="inline-flex items-center gap-2 px-5 py-2 bg-blue-50 text-blue-700 rounded-full text-sm font-medium">
          <i className="fas fa-clock"></i> Coming in Phase 2
        </span>
      </div>
    </div>
  );

  // ---------- MAIN APP ----------
  const App = () => {
    const [activeTab, setActiveTab] = useState('home');

    const navItems = [
      { id: 'home', label: 'Home', icon: 'fa-home' },
      { id: 'wall', label: 'Wall of Fame', icon: 'fa-book-open' },
      { id: 'seasons', label: 'Seasons', icon: 'fa-trophy' },
      { id: 'profiles', label: 'Profiles', icon: 'fa-users' },
    ];

    return (
      <div className="min-h-screen bg-[#F8FAFC] font-sans selection:bg-blue-100 selection:text-[#004BA0]">
        <nav className="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
          <div className="max-w-6xl mx-auto px-4 h-20 flex items-center justify-between">
            <div 
              className="flex items-center gap-3 cursor-pointer group"
              onClick={() => setActiveTab('home')}
            >
              <div className="w-10 h-10 bg-[#004BA0] text-[#D1AB3E] rounded-xl flex items-center justify-center font-black group-hover:rotate-12 transition-transform">
                MI
              </div>
              <span className="font-black text-xl tracking-tight hidden sm:block">FANHUB</span>
            </div>

            <div className="flex items-center gap-1 sm:gap-2">
              {navItems.map((item) => {
                const isActive = activeTab === item.id;
                return (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold transition-all ${
                      isActive 
                        ? 'bg-[#004BA0] text-white shadow-lg shadow-blue-900/20' 
                        : 'text-slate-500 hover:bg-slate-100'
                    }`}
                  >
                    <i className={`fas ${item.icon}`}></i>
                    <span className="hidden md:block">{item.label}</span>
                  </button>
                );
              })}
            </div>
          </div>
        </nav>

        <main className="max-w-6xl mx-auto px-4 py-12">
          <div className="animate-in">
            {activeTab === 'home' && <HomeView onNavigate={setActiveTab} />}
            {activeTab === 'wall' && <WallOfFameView />}
            {activeTab === 'seasons' && <SeasonHistoryView />}
            {activeTab === 'profiles' && <ProfilesView />}
          </div>
        </main>

        <footer className="border-t border-slate-200 bg-white py-12">
          <div className="max-w-6xl mx-auto px-4">
            <div className="flex flex-col md:flex-row justify-between items-center gap-6">
              <div className="text-center md:text-left">
                <div className="font-black text-xl text-[#004BA0]">MUMBAI INDIANS</div>
                <p className="text-sm text-slate-400 font-medium">EST. 2008 • {MI_STATS.tagline}</p>
              </div>
              <div className="flex gap-8">
                <div className="text-center">
                  <div className="text-xl font-black text-slate-800">5</div>
                  <div className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">IPL Cups</div>
                </div>
                <div className="text-center border-l border-slate-100 pl-8">
                  <div className="text-xl font-black text-slate-800">2</div>
                  <div className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">CLT20 Cups</div>
                </div>
              </div>
            </div>
            <p className="text-center text-xs text-slate-300 mt-8">Proudly unofficial • Made with 💙 for the Paltan</p>
          </div>
        </footer>
      </div>
    );
  };

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
